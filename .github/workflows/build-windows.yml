name: Build aql.KeyFlip

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore "aql.KeyFlip-v3.1.3-PRO-Installer-Package/native/aql.KeyFlip.sln"

      - name: Test
        run: dotnet test "aql.KeyFlip-v3.1.3-PRO-Installer-Package/native/aql.KeyFlip.sln" --configuration Release --no-restore

      - name: Publish Windows x64
        run: >
          dotnet publish
          "aql.KeyFlip-v3.1.3-PRO-Installer-Package/native/src/aql.KeyFlip.UI/aql.KeyFlip.UI.csproj"
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o "aql.KeyFlip-v3.1.3-PRO-Installer-Package/native/build/publish"

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = "aql.KeyFlip-v3.1.3-PRO-Installer-Package/native/build/publish/aql.KeyFlip.exe"
          if (!(Test-Path $exe)) {
            Write-Error "aql.KeyFlip.exe was not created."
          }
          Write-Host "EXE created successfully:"
          Get-Item $exe | Format-List FullName,Length

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Installer
        shell: pwsh
        run: |
          $iss = "aql.KeyFlip-v3.1.3-PRO-Installer-Package/native/build/installer-setup.iss"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" $iss

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: aql.KeyFlip-v3.1.3-win-x64
          path: aql.KeyFlip-v3.1.3-PRO-Installer-Package/native/build/publish/aql.KeyFlip.exe

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: aql.KeyFlip-v3.1.3-installer
          path: aql.KeyFlip-v3.1.3-PRO-Installer-Package/native/build/*.exe
